name: Audio public production E2E one-shot
on:
  push:
    branches: [verify/audio-full-e2e-20261008]
    paths: [.github/workflows/audio-pages-readback-once.yml]
permissions:
  contents: write
jobs:
  public-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: e11bf5abe8cd010a392351ef499590b7df9ec181
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e11bf5abe8cd010a392351ef499590b7df9ec181
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recreate exact production bundle and verify Pages HTTP/assets
        id: readback
        continue-on-error: true
        env:
          VITE_BUILD_SHA: e11bf5abe8cd010a392351ef499590b7df9ec181
        run: |
          npm run build
          node scripts/readback.mjs | tee /tmp/audio-pages-readback.log
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const r=await fetch('https://jacquer-ai.github.io/personal-audio-deal-board/version.json?e2e='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(30000)});
          assert(r.ok,'version.json HTTP '+r.status);
          const j=await r.json();
          assert.equal(j.sha,process.env.EXPECTED_SHA,'Deployed SHA is not the tested HEAD');
          console.log('VERSION_MATCHED',j.sha);
          JS
      - name: Browser E2E on public URL
        id: browser
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          BASE_URL=https://jacquer-ai.github.io/personal-audio-deal-board/ npm run test:e2e
      - name: Store independent public readback receipt
        if: ${{ always() }}
        env:
          READBACK_RESULT: ${{ steps.readback.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          E2E_BRANCH: verify/audio-full-e2e-20261008
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const rec={schema:1,at:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID,expectedSha:process.env.EXPECTED_SHA,readback:process.env.READBACK_RESULT,browser:process.env.BROWSER_RESULT,url:'https://jacquer-ai.github.io/personal-audio-deal-board/',logExcerpt:fs.existsSync('/tmp/audio-pages-readback.log')?fs.readFileSync('/tmp/audio-pages-readback.log','utf8').slice(-3500):null};
          fs.writeFileSync('/tmp/audio-public-e2e-receipt.json',JSON.stringify(rec,null,2)+'\n');
          console.log(JSON.stringify(rec));
          JS
          content="$(base64 -w0 /tmp/audio-public-e2e-receipt.json)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/e2e-audio-public-receipt.json" \
            -f message="e2e: capture production readback and public browser test [skip ci]" \
            -f branch="$E2E_BRANCH" -f content="$content"
      - name: Enforce production gate
        if: ${{ always() }}
        env:
          READBACK_RESULT: ${{ steps.readback.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          test "$READBACK_RESULT" = "success" && test "$BROWSER_RESULT" = "success"
