name: Audio market reference regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/market-stats.json'
      - 'data/retail-price-references.json'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/market-reference-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect Marktplaats item-local price-model enum (diagnostic only)
        run: node scripts/inspect-mp-price-evidence.mjs
      - name: Retail Ceneo live probe (read-only, no data writes)
        run: node scripts/refresh-retail-references.mjs --dry-run
      - run: npm run prepare-data
      - run: npm run validate-data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
