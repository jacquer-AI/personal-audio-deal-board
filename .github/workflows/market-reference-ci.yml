name: Audio market reference regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/market-stats.json'
      - 'data/retail-price-references.json'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/market-reference-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare-data
      - run: npm run validate-data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
