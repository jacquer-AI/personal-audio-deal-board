name: Refresh personal audio market

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh depth
        required: true
        default: quick
        type: choice
        options: [quick, full, deep]
      categories:
        description: Category scope
        required: true
        default: all
        type: choice
        options: [all, IEM, TWS, Closed, "Głośniki BT"]
  schedule:
    - cron: "11 */6 * * *"
    - cron: "37 2 * * *"
    - cron: "53 3 * * 0"

concurrency:
  group: audio-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REQUESTED_MODE: ${{ inputs.mode || 'quick' }}
      REQUESTED_CATEGORIES: ${{ inputs.categories || 'all' }}
      SCHEDULE_EXPR: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve mode
        run: |
          mode="$REQUESTED_MODE"
          if [ "$SCHEDULE_EXPR" = "37 2 * * *" ]; then mode="full"; fi
          if [ "$SCHEDULE_EXPR" = "53 3 * * 0" ]; then mode="deep"; fi
          echo "REFRESH_MODE=$mode" >> "$GITHUB_ENV"
          echo "REFRESH_CATEGORIES=$REQUESTED_CATEGORIES" >> "$GITHUB_ENV"
      - run: npm run sync
      - run: npm run refresh-market -- --mode "$REFRESH_MODE" --categories "$REFRESH_CATEGORIES"
      - run: npm run merge-market
      - run: npm run validate-data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
