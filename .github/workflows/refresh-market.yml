name: Refresh market data
run-name: Refresh ${{ inputs.mode || 'scheduled' }} · ${{ inputs.categories || 'all' }}
on:
  push:
    branches: [verify/audio-full-e2e-20261008]
    paths: [.github/workflows/refresh-market.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh depth
        required: true
        default: quick
        type: choice
        options: [quick, full, deep]
      categories:
        description: Category scope
        required: true
        default: all
        type: choice
        options: [all, IEM, TWS, Closed, "Głośniki BT"]
  schedule:
    - cron: "11 */6 * * *"
    - cron: "37 2 * * *"
    - cron: "53 3 * * 0"
permissions:
  contents: write
  actions: write
concurrency:
  group: audio-market-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUESTED_MODE: ${{ github.event_name == 'push' && 'full' || inputs.mode || 'quick' }}
      REQUESTED_CATEGORIES: ${{ inputs.categories || 'all' }}
      SCHEDULE_EXPR: ${{ github.event.schedule }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Phase: PLAN (validate mode and scope)"
        run: |
          mode="$REQUESTED_MODE"
          if [ "$SCHEDULE_EXPR" = "37 2 * * *" ]; then mode="full"; fi
          if [ "$SCHEDULE_EXPR" = "53 3 * * 0" ]; then mode="deep"; fi
          case "$mode" in quick|full|deep) ;; *) echo "invalid mode"; exit 2 ;; esac
          case "$REQUESTED_CATEGORIES" in all|IEM|TWS|Closed|"Głośniki BT") ;; *) echo "invalid categories"; exit 2 ;; esac
          echo "REFRESH_MODE=$mode" >> "$GITHUB_ENV"
          echo "REFRESH_CATEGORIES=$REQUESTED_CATEGORIES" >> "$GITHUB_ENV"
      - name: "Phase: REFRESH (discovery and direct-page verification)"
        id: refresh
        run: |
          npm run sync
          npm run refresh-market -- --mode "$REFRESH_MODE" --categories "$REFRESH_CATEGORIES" | tee /tmp/audio-refresh-e2e.log
          npm run merge-market
      - name: "Phase: VALIDATE (corrupt data never publishes)"
        run: |
          npm run validate-data
          npm test
      - name: "Phase: PERSIST (commit only material changes)"
        id: persist
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "audio-market-refresh[bot]"
          git config user.email "audio-market-refresh@users.noreply.github.com"
          git add data/market-current.json data/market-observations.jsonl data/refresh-delta.json data/market-candidates.json data/market-stats.json data/offers.json
          git commit -m "data: market refresh $REFRESH_MODE ($GITHUB_RUN_ID)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy is dispatched explicitly.
      - name: "Phase: DEPLOY (dispatch Pages build)"
        if: steps.refresh.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
      - name: No material change
        if: steps.refresh.outputs.changed != 'true'
        run: echo "DELTA=NONE - no commit, no deploy"

      - name: "E2E one-shot: write run receipt on isolated verification branch"
        if: ${{ always() && github.event_name == 'push' }}
        env:
          E2E_BRANCH: verify/audio-full-e2e-20261008
          E2E_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const log=fs.existsSync('/tmp/audio-refresh-e2e.log')?fs.readFileSync('/tmp/audio-refresh-e2e.log','utf8'):'';
          let summary=null;
          const markers=[...log.matchAll(/^\{\s*$/gm)].map(m=>m.index);
          for (const p of markers) {
            const tail=log.slice(p);
            let braces=0, inString=false, escape=false, end=-1;
            for(let i=0;i<tail.length;i++){
              const c=tail[i];
              if(inString){if(escape)escape=false;else if(c==='\\')escape=true;else if(c==='"')inString=false;}
              else if(c==='"')inString=true;else if(c==='{')braces++;else if(c==='}'&&!--braces){end=i+1;break;}
            }
            if(end>0)try{const j=JSON.parse(tail.slice(0,end));if(j.mode&&j.receipt&&j.DELTA)summary=j;}catch{}
          }
          const receipt={schema:1,runId:process.env.GITHUB_RUN_ID,at:new Date().toISOString(),ref:process.env.GITHUB_REF_NAME,mode:process.env.REFRESH_MODE||'full',workflow:'refresh-market.yml',summary,status:summary?'RECEIPT_CAPTURED':'RECEIPT_MISSING'};
          fs.writeFileSync('/tmp/audio-e2e-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify({status:receipt.status,runId:receipt.runId,sourceCount:summary?.receipt?.discovery?.plannedSources,verified:summary?.receipt?.directVerified,blocked:summary?.receipt?.accessRestricted,delta:summary?.DELTA}));
          JS
          content="$(base64 -w0 /tmp/audio-e2e-receipt.json)"
          existing_sha="$(gh api "repos/$E2E_REPO/contents/e2e-audio-full-receipt.json?ref=$E2E_BRANCH" --jq .sha)"
          gh api -X PUT "repos/$E2E_REPO/contents/e2e-audio-full-receipt.json" \
            -f message="e2e: record post-fix FULL receipt $GITHUB_RUN_ID [skip ci]" \
            -f branch="$E2E_BRANCH" -f content="$content" -f sha="$existing_sha"
