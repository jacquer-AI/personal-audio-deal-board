name: SWPS 17 Oct – three missing study audiobooks
on:
  push:
    branches: [audio/swps-17oct-required-20261014]
    paths:
      - .github/workflows/swps-saturday-required-20261014.yml
      - study-audio/swps_saturday_required_tts.py
      - study-audio/saturday-required/**
permissions:
  contents: read
jobs:
  neural_speech:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install no-fee speech dependencies
        run: |
          python -m pip install -q --disable-pip-version-check edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Synthesize three original study guides
        run: python study-audio/swps_saturday_required_tts.py
      - name: Archive finished files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swps-saturday-three-missing-notes
          path: out_saturday_required/*.mp3
          retention-days: 2
          if-no-files-found: warn
