name: SWPS 17 Oct – four Polish neural study audios
on:
  push:
    branches: [audio/swps-three-lessons-20261014]
    paths:
      - .github/workflows/swps-three-audio-20261014.yml
      - study-audio/swps-three-audio-20261014.py
      - study-audio/course-notes/**
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free speech and PDF tooling
        run: |
          python -m pip install -q --disable-pip-version-check edge-tts pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render all Polish neural study tracks
        run: python study-audio/swps-three-audio-20261014.py
      - name: Save finished MP3s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swps-17-october-audiobooks
          path: |
            out_audio/*.mp3
            out_audio/*_parametry.json
          retention-days: 2
          if-no-files-found: warn
